<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Device Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .glass {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-dot { animation: pulse-slow 2s infinite; }
    </style>
</head>
<body class="bg-[#0b1120] text-gray-100 font-sans antialiased min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                    Device Intelligence Dashboard
                </h1>
                <p class="text-gray-400 flex items-center gap-2 mt-1">
                    <span class="w-2 h-2 rounded-full bg-green-500 status-dot"></span>
                    <span id="status-message">Sistem Berjalan Normal</span>
                </p>
            </div>
            <div class="flex gap-3">
                <button onclick="location.reload()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg transition-all text-sm font-medium flex items-center gap-2">
                    <i class="fas fa-sync-alt"></i> Refresh Data
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-2 space-y-6">
                <div class="glass rounded-2xl p-6 shadow-2xl">
                    <h2 class="text-lg font-semibold mb-6 flex items-center gap-2">
                        <i class="fas fa-chart-line text-blue-400"></i> Real-time Performance (CPU vs RAM)
                    </h2>
                    <div class="h-[300px] w-full">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass rounded-2xl p-5 border-l-4 border-blue-500">
                        <p class="text-gray-400 text-sm mb-1">Hostname & OS</p>
                        <h3 id="server-host" class="text-xl font-mono text-blue-300 font-bold">-</h3>
                        <p id="server-os" class="text-sm text-gray-300 mt-1 italic">-</p>
                    </div>
                    <div class="glass rounded-2xl p-5 border-l-4 border-emerald-500">
                        <p class="text-gray-400 text-sm mb-1">CPU Architecture</p>
                        <h3 id="server-cpu" class="text-xl font-semibold text-emerald-400">-</h3>
                        <p class="text-xs text-gray-500 mt-1 uppercase tracking-wider">Active Core Processing</p>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="glass rounded-2xl p-6 shadow-xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4 opacity-10">
                        <i class="fas fa-user-shield text-6xl"></i>
                    </div>
                    <h2 class="text-xl font-bold mb-6 text-purple-400">Client Info</h2>
                    <div class="space-y-5">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-400 text-sm">IP Address</span>
                            <span id="client-ip" class="px-3 py-1 bg-purple-500/20 text-purple-300 rounded-md font-mono text-sm">-</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-400 text-sm">Browser</span>
                            <span id="client-browser" class="font-medium text-sm text-right">-</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-400 text-sm">Device</span>
                            <span id="client-device" class="capitalize font-medium text-sm">-</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-400 text-sm">Connectivity</span>
                            <span id="net-status" class="px-2 py-0.5 bg-green-900/50 text-green-400 text-[10px] font-bold rounded uppercase">-</span>
                        </div>
                        <hr class="border-gray-700">
                        <div>
                            <p class="text-[10px] text-gray-500 uppercase font-bold mb-2">User Agent Identification</p>
                            <p id="client-ua" class="text-[11px] text-gray-400 leading-relaxed bg-black/30 p-3 rounded-lg border border-gray-700 font-mono italic">-</p>
                        </div>
                    </div>
                </div>

                <div class="glass rounded-2xl p-6 shadow-xl">
                    <h2 class="text-lg font-semibold mb-4 text-yellow-500">Resource Suggestion</h2>
                    <div id="server-ram-container" class="mb-4">
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-gray-400">Memory Load</span>
                            <span id="server-ram-val" class="text-yellow-400 font-bold">0%</span>
                        </div>
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div id="ram-progress-bar" class="bg-yellow-500 h-2 rounded-full transition-all duration-1000" style="width: 0%"></div>
                        </div>
                    </div>
                    <p id="server-suggestion" class="text-sm text-gray-300 italic bg-blue-500/10 p-3 rounded-lg border border-blue-500/20">-</p>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
